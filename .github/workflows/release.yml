name: Desktop Release

on:
  workflow_call:
    inputs:
      product-slug:
        required: true
        type: string
      workspace:
        required: true
        type: string
      package-path:
        required: true
        type: string
      installer-prefix:
        required: true
        type: string
      executable-name:
        required: true
        type: string
      r2-bucket:
        required: true
        type: string
      downloads-base:
        required: true
        type: string
      node-version:
        required: false
        type: string
        default: "22.23.2"
      tag-prefix:
        required: false
        type: string
        default: "desktop-v"
      upstream-manifest:
        description: "Optional JSON file whose .commit must match the submodule index. Checked before packaging."
        required: false
        type: string
        default: ""
      upstream-submodule:
        description: "Submodule path guarded by upstream-manifest."
        required: false
        type: string
        default: ""
      verify-published-bytes:
        description: "Bytes to stream from each published artifact when checking the CDN. 0 downloads and hashes in full."
        required: false
        type: number
        default: 2000000
      install-command:
        description: "Command to install JS dependencies (yarn install --immutable, pnpm install --frozen-lockfile, npm ci)."
        required: false
        type: string
        default: "yarn install --immutable"
      build-command:
        description: "Root command to build workspace dependencies."
        required: false
        type: string
        default: "yarn build"
      workspace-run-prefix:
        description: "Prefix to run a workspace script, e.g. 'yarn workspace' or 'pnpm --filter'."
        required: false
        type: string
        default: "yarn workspace"
      kit-ref:
        description: "Fallback kit reference <owner>/desktop-release-kit/.github/workflows/release.yml@<sha> used when github.job_workflow_ref is empty. Pass the same repo and SHA as the caller's `uses:` line."
        required: false
        type: string
        default: ""
      r2-endpoint:
        description: "R2 S3 endpoint (https://<account-id>.r2.cloudflarestorage.com). The account id stays out of the kit source."
        required: true
        type: string
      updater-contract-mode:
        description: "How to verify the macOS updater handoff contract. 'app-root' scans the packaged .app's asar.unpacked; 'lib-root' reads the compiled shell sources (updater.js + main.js) — for products that keep runtime JS inside app.asar with no asarUnpack."
        required: false
        type: string
        default: "app-root"
    secrets:
      APPLE_CERTIFICATE:
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        required: true
      APPLE_ID:
        required: true
      APPLE_PASSWORD:
        required: true
      APPLE_TEAM_ID:
        required: true
      MAC_CSC_NAME:
        required: true
      CF_R2_ACCESS_KEY_ID:
        required: true
      CF_R2_SECRET_ACCESS_KEY:
        required: true
      JENKINS_SIGN_URL:
        required: true
      JENKINS_SIGN_USER:
        required: true
      JENKINS_SIGN_TOKEN:
        required: true

concurrency:
  group: desktop-release-${{ inputs['product-slug'] }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  SOURCE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  DESKTOP_WORKSPACE: ${{ inputs.workspace }}
  DESKTOP_PACKAGE_PATH: ${{ inputs['package-path'] }}
  PRODUCT_SLUG: ${{ inputs['product-slug'] }}
  INSTALLER_PREFIX: ${{ inputs['installer-prefix'] }}
  RELEASE_EXECUTABLE_NAME: ${{ inputs['executable-name'] }}
  R2_BUCKET: ${{ inputs['r2-bucket'] }}
  R2_ENDPOINT: ${{ inputs['r2-endpoint'] }}
  DOWNLOADS_BASE: ${{ inputs['downloads-base'] }}
  RELEASE_TAG_PREFIX: ${{ inputs['tag-prefix'] }}
  # job_workflow_ref is the called kit workflow (owner/kit/.github/workflows/release.yml@ref)
  # but some GitHub deployments leave it empty, so the caller passes kit-ref as
  # an explicit fallback. Never fall back to github.workflow_ref (the caller) —
  # that would checkout the product repo on sign runners.
  KIT_WORKFLOW_REF: ${{ github.job_workflow_ref || inputs['kit-ref'] }}
  INSTALL_COMMAND: ${{ inputs['install-command'] }}
  BUILD_COMMAND: ${{ inputs['build-command'] }}
  WORKSPACE_RUN_PREFIX: ${{ inputs['workspace-run-prefix'] }}

jobs:
  create-release:
    if: ${{ (github.event_name == 'push' && !startsWith(github.ref_name, 'desktop-macos-v') && !startsWith(github.ref_name, 'desktop-windows-v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.platform == 'all') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          fail() { echo "::error ::$*"; exit 1; }
          [[ "$PRODUCT_SLUG" =~ ^[a-z0-9][a-z0-9-]{1,40}$ ]] || fail "product-slug must match ^[a-z0-9][a-z0-9-]{1,40}$"
          [[ "$R2_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,62}$ ]] || fail "r2-bucket must match ^[a-z0-9][a-z0-9.-]{1,62}$"
          # installer-prefix is spliced into glob patterns; must be space- and glob-free.
          prefix_ok() { [[ "$1" != *' '* ]] && [[ "$1" != *[*?[]* ]] && [[ "$1" != */* ]]; }
          # executable-name may contain spaces (e.g. "SeaVerse Harness.exe"); reject
          # only shell/glob hazards.
          exe_ok() { [[ "$1" != *[*?[]* ]] && [[ "$1" != *[\\\$\`\"\']* ]] && [[ "$1" != */* ]]; }
          prefix_ok "$INSTALLER_PREFIX" || fail "installer-prefix must not contain / whitespace or glob metacharacters (* ? [)"
          exe_ok "$RELEASE_EXECUTABLE_NAME" || fail "executable-name must not contain / \\ \$ \` \" ' or glob metacharacters (* ? [)"

      - name: Resolve kit source
        id: kit
        shell: bash
        run: |
          ref="${KIT_WORKFLOW_REF}"
          repository="${ref%%/.github/*}"
          if [[ ! "$repository" =~ ^[A-Za-z0-9._-]+/desktop-release-kit$ ]]; then
            echo "::error ::KIT_WORKFLOW_REF must resolve to <owner>/desktop-release-kit, got: ${repository:-<empty>}"
            exit 1
          fi
          echo "repository=${repository}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref##*@}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.kit.outputs.repository }}
          ref: ${{ steps.kit.outputs.ref }}
          persist-credentials: false
          sparse-checkout: scripts

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ inputs['node-version'] }}

      - name: Resolve release metadata
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists, skipping creation"
          else
            prerelease_flag=""
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              prerelease_flag="--prerelease"
            fi
            gh release create "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --title "$INSTALLER_PREFIX $RELEASE_TAG" \
              --generate-notes \
              $prerelease_flag
          fi

  publish-macos:
    needs: [create-release]
    if: ${{ always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') && ((github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos')) || (github.event_name == 'push' && (startsWith(github.ref_name, 'v') || startsWith(github.ref_name, inputs['tag-prefix']) || startsWith(github.ref_name, 'desktop-macos-v')))) }}
    permissions:
      contents: read
      packages: read
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
          # Product repos that vendor an upstream checkout (e.g. a git submodule)
          # need it present for layout/release gates. Caller owns the pin.
          submodules: recursive

      - name: Resolve kit source
        id: kit
        shell: bash
        run: |
          ref="${KIT_WORKFLOW_REF}"
          repository="${ref%%/.github/*}"
          if [[ ! "$repository" =~ ^[A-Za-z0-9._-]+/desktop-release-kit$ ]]; then
            echo "::error ::KIT_WORKFLOW_REF must resolve to <owner>/desktop-release-kit, got: ${repository:-<empty>}"
            exit 1
          fi
          echo "repository=${repository}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref##*@}" >> "$GITHUB_OUTPUT"

      - name: Checkout release kit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.kit.outputs.repository }}
          ref: ${{ steps.kit.outputs.ref }}
          path: .release-kit
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ inputs['node-version'] }}

      - name: Resolve release metadata
        shell: bash
        run: node .release-kit/scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"
      # Signing and notarization take ~20 minutes, so reject a stale upstream pin
      # now rather than letting the product's own layout gate catch it afterwards.
      - name: Verify upstream submodule pin
        if: inputs['upstream-manifest'] != '' && inputs['upstream-submodule'] != ''
        shell: bash
        run: |
          node .release-kit/scripts/verify-submodule-pins.mjs \
            --manifest "${{ inputs['upstream-manifest'] }}" \
            --submodule "${{ inputs['upstream-submodule'] }}"

      - name: Enable Corepack
        run: corepack enable

      - name: Install JS dependencies
        run: ${{ env.INSTALL_COMMAND }}

      - name: Set desktop package version from tag
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const version = process.env.DESKTOP_VERSION;
          if (!version) throw new Error('DESKTOP_VERSION env var is missing');

          // The desktop package gate asserts its version matches the root
          // workspace manifest, so stamp both.
          for (const packageJsonPath of [
            path.join(process.env.DESKTOP_PACKAGE_PATH, 'package.json'),
            'package.json',
          ]) {
            const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, 'utf8'));
            packageJson.version = version;
            fs.writeFileSync(packageJsonPath, `${JSON.stringify(packageJson, null, 2)}\n`);
          }
          NODE

      - name: Build workspace dependencies
        run: ${{ env.BUILD_COMMAND }}

      - name: Build signed and notarized macOS DMG
        shell: bash
        env:
          # macOS signing via electron-builder's CSC_LINK p12 path. The desktop
          # release-preflight additionally expects CSC_NAME (certificate common
          # name without the "Developer ID Application:" prefix) to select it.
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CSC_NAME: ${{ secrets.MAC_CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # electron-builder downloads its own toolchain separately from the
          # Electron binary; pin to the canonical GitHub releases source.
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
        # asarUnpack ships node_modules as loose files; packaging and signing
        # them exceeds the macOS runner's descriptor budget (EMFILE). ulimit
        # alone is silently capped by kern.maxfilesperproc, so raise the
        # kernel caps first.
        run: |
          sudo sysctl -w kern.maxfiles=524288 kern.maxfilesperproc=262144
          ulimit -n 262144
          ulimit -n
          ${{ env.WORKSPACE_RUN_PREFIX }} "$DESKTOP_WORKSPACE" dist:mac

      # A correctly signed, notarized build can still ship an update that never
      # installs, and nothing downstream would notice: the pipeline goes green and
      # the failure only surfaces on a user's machine. Assert the two macOS install
      # handoff contracts before publishing it. app-root scans the packaged bundle;
      # lib-root reads the compiled shell sources (products with no asarUnpack).
      - name: Verify macOS updater contract
        shell: bash
        run: |
          if [ "${{ inputs['updater-contract-mode'] }}" = "lib-root" ]; then
            node .release-kit/scripts/verify-updater-contract.mjs --lib-root "$DESKTOP_PACKAGE_PATH/lib"
          else
            app="$(find "$DESKTOP_PACKAGE_PATH/dist/mac-release" -maxdepth 2 -type d -name '*.app' -print -quit)"
            if [[ -z "$app" ]]; then
              echo "::error ::No .app bundle found under $DESKTOP_PACKAGE_PATH/dist/mac-release"
              exit 1
            fi
            node .release-kit/scripts/verify-updater-contract.mjs --app-root "$app"
          fi

      # A green package + upload can still name artifacts that do not exist:
      # electron-builder sanitizes productName into the manifest filename, so an
      # implicit artifactName yields url entries no object store will ever hold.
      # Verify every manifest entry verbatim against disk before anything ships.
      - name: Verify release artifacts (manifest ↔ disk)
        shell: bash
        run: |
          dist="$DESKTOP_PACKAGE_PATH/dist/mac-release"
          version="$DESKTOP_VERSION"

          # electron-builder names the manifest after the channel it derives
          # from the version (latest-mac.yml stable, rc-mac.yml for -rc.N).
          # Normalize to latest-mac.yml here; promote alone decides which
          # pointer key (latest-mac.yml vs rc-mac.yml) the content lands on.
          case "$version" in
            *-*) pre="${version#*-}"; channel="${pre%%.*}";;
            *)   channel="latest";;
          esac
          manifest_name="${channel}-mac.yml"
          [ -f "$dist/$manifest_name" ] || { echo "::error ::$manifest_name missing under $dist"; ls "$dist"; exit 1; }
          if [ "$manifest_name" != "latest-mac.yml" ]; then
            cp "$dist/$manifest_name" "$dist/latest-mac.yml"
          fi

          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs'
          import { join } from 'node:path'

          const dist = join(process.env.DESKTOP_PACKAGE_PATH, 'dist', 'mac-release')
          const manifest = readFileSync(join(dist, 'latest-mac.yml'), 'utf8')
          const version = process.env.DESKTOP_VERSION

          const manifestVersion = /^version:\s*(.+)$/m.exec(manifest)?.[1].trim()
          if (manifestVersion !== version) {
            console.error(`::error ::latest-mac.yml version ${manifestVersion} does not match tag version ${version}`)
            process.exit(1)
          }

          // Every `url:` under files[] must name a file that exists verbatim.
          const urls = [...manifest.matchAll(/^\s*-?\s*url:\s*(.+)$/gm)].map(m => m[1].trim())
          if (urls.length === 0) {
            console.error('::error ::latest-mac.yml lists no file urls')
            process.exit(1)
          }
          const missing = urls.filter(url => !existsSync(join(dist, url)))
          if (missing.length > 0) {
            for (const url of missing) console.error(`::error ::latest-mac.yml points at a missing file: ${url}`)
            process.exit(1)
          }
          console.log(`verify-release-artifacts: ${urls.length} manifest entr(ies) match files on disk`)
          NODE

      - name: Upload to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
        run: |
          shopt -s nullglob
          dmgs=("$DESKTOP_PACKAGE_PATH/dist/mac-release/"*.dmg)
          if [[ ${#dmgs[@]} -eq 0 || ! -f "${dmgs[0]}" ]]; then
            echo "::error ::No macOS DMG produced by the release build."
            exit 1
          fi
          for f in "$DESKTOP_PACKAGE_PATH/dist/mac-release/"*.dmg \
                   "$DESKTOP_PACKAGE_PATH/dist/mac-release/"*.zip \
                   "$DESKTOP_PACKAGE_PATH/dist/mac-release/"*.blockmap; do
            [ -f "$f" ] || continue
            node .release-kit/scripts/r2-put.mjs \
              --file "$f" \
              --bucket "$R2_BUCKET" \
              --key "$PRODUCT_SLUG/$DESKTOP_VERSION/$(basename "$f")" \
              --endpoint "$R2_ENDPOINT" \
              --immutable
          done

      - name: Install manifest dependency
        shell: bash
        run: npm install --prefix .release-kit/scripts --no-save --no-package-lock --ignore-scripts yaml@2

      - name: Prepare macOS auto-updater manifest
        shell: bash
        run: |
          shopt -s nullglob
          manifest="$DESKTOP_PACKAGE_PATH/dist/mac-release/latest-mac.yml"
          if [[ ! -f "$manifest" ]]; then
            echo "::error ::No latest-mac.yml produced by the release build."
            exit 1
          fi
          # electron-builder writes the zip (and optional dmg) into latest-mac.yml.
          # Rewrite files[].url to ${version}/<file> so electron-updater can fetch
          # from feed URL ${DOWNLOADS_BASE}/${PRODUCT_SLUG}.
          export NODE_PATH="$GITHUB_WORKSPACE/.release-kit/scripts/node_modules"
          if ! node -e "const {parse}=require('yaml');const m=parse(require('fs').readFileSync(process.argv[1],'utf8'));if(!Array.isArray(m.files)||!m.files.some(f=>typeof f?.url==='string'&&f.url.endsWith('.zip')))process.exit(1)" "$manifest"; then
            echo "::error ::latest-mac.yml must list a zip artifact for electron-updater."
            exit 1
          fi
          node .release-kit/scripts/prepare-desktop-update-manifest.mjs \
            --manifest "$manifest" \
            --version "$DESKTOP_VERSION"

      - name: Upload macOS manifest artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mac-manifest-${{ env.DESKTOP_VERSION }}
          path: ${{ env.DESKTOP_PACKAGE_PATH }}/dist/mac-release/latest-mac.yml
          retention-days: 1

  publish-windows:
    needs: [create-release]
    if: ${{ always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') && ((github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows')) || (github.event_name == 'push' && (startsWith(github.ref_name, 'v') || startsWith(github.ref_name, inputs['tag-prefix']) || startsWith(github.ref_name, 'desktop-windows-v')))) }}
    permissions:
      contents: read
      packages: read
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Resolve kit source
        id: kit
        shell: bash
        run: |
          ref="${KIT_WORKFLOW_REF}"
          repository="${ref%%/.github/*}"
          if [[ ! "$repository" =~ ^[A-Za-z0-9._-]+/desktop-release-kit$ ]]; then
            echo "::error ::KIT_WORKFLOW_REF must resolve to <owner>/desktop-release-kit, got: ${repository:-<empty>}"
            exit 1
          fi
          echo "repository=${repository}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref##*@}" >> "$GITHUB_OUTPUT"

      - name: Checkout release kit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.kit.outputs.repository }}
          ref: ${{ steps.kit.outputs.ref }}
          path: .release-kit
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ inputs['node-version'] }}

      - name: Resolve release metadata
        shell: bash
        run: node .release-kit/scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Enable Corepack
        run: corepack enable

      - name: Install JS dependencies
        run: ${{ env.INSTALL_COMMAND }}

      - name: Set desktop package version from tag
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const version = process.env.DESKTOP_VERSION;
          if (!version) throw new Error('DESKTOP_VERSION env var is missing');

          // The desktop package gate asserts its version matches the root
          // workspace manifest, so stamp both.
          for (const packageJsonPath of [
            path.join(process.env.DESKTOP_PACKAGE_PATH, 'package.json'),
            'package.json',
          ]) {
            const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, 'utf8'));
            packageJson.version = version;
            fs.writeFileSync(packageJsonPath, `${JSON.stringify(packageJson, null, 2)}\n`);
          }
          NODE

      - name: Build workspace dependencies
        run: ${{ env.BUILD_COMMAND }}

      - name: Build unsigned Windows win-unpacked directory
        shell: bash
        run: ${{ env.WORKSPACE_RUN_PREFIX }} "$DESKTOP_WORKSPACE" dist:win-unpacked

      # The unsigned app travels to the signing stage via a run-scoped artifact:
      # private, no extra credentials on the self-hosted sign runner.
      - name: Upload unsigned app artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: win-unpacked-${{ env.DESKTOP_VERSION }}
          path: ${{ env.DESKTOP_PACKAGE_PATH }}/dist/win-unpacked/
          retention-days: 1

  # The Jenkins signing runner can reach the private signing service, while the
  # hosted Windows builder cannot. Sign the app directory before NSIS packs it.
  # This job never checkouts the product repo — only the kit (scripts) plus
  # the unsigned artifact.
  sign-windows-app:
    needs: [publish-windows]
    if: ${{ always() && needs.publish-windows.result == 'success' }}
    runs-on: sign
    permissions:
      contents: read
    steps:
      - name: Resolve kit source
        id: kit
        shell: bash
        run: |
          ref="${KIT_WORKFLOW_REF}"
          repository="${ref%%/.github/*}"
          if [[ ! "$repository" =~ ^[A-Za-z0-9._-]+/desktop-release-kit$ ]]; then
            echo "::error ::KIT_WORKFLOW_REF must resolve to <owner>/desktop-release-kit, got: ${repository:-<empty>}"
            exit 1
          fi
          echo "repository=${repository}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref##*@}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.kit.outputs.repository }}
          ref: ${{ steps.kit.outputs.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ inputs['node-version'] }}

      - name: Resolve release metadata
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Download unsigned app artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: win-unpacked-${{ env.DESKTOP_VERSION }}
          path: win-unpacked

      - name: Sign app executables via Jenkins
        shell: bash
        env:
          JENKINS_URL: ${{ secrets.JENKINS_SIGN_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_SIGN_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_SIGN_TOKEN }}
        run: |
          app_root="win-unpacked"
          node scripts/list-windows-signing-targets.mjs --root "$app_root" > signing-targets.txt
          [ -s signing-targets.txt ] || { echo "::error ::No Windows signing targets resolved under $app_root."; exit 1; }
          while IFS= read -r exe; do
            node scripts/sign-windows-via-jenkins.mjs --exe "$exe"
          done < signing-targets.txt

      - name: Upload signed app artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: win-unpacked-signed-${{ env.DESKTOP_VERSION }}
          path: win-unpacked/
          retention-days: 1

  # Build the NSIS installer on Windows from the signed app directory. The
  # verification here prevents publishing an installer with unsigned core EXEs.
  package-windows-installer:
    needs: [sign-windows-app]
    if: ${{ always() && needs.sign-windows-app.result == 'success' }}
    permissions:
      contents: read
      packages: read
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Resolve kit source
        id: kit
        shell: bash
        run: |
          ref="${KIT_WORKFLOW_REF}"
          repository="${ref%%/.github/*}"
          if [[ ! "$repository" =~ ^[A-Za-z0-9._-]+/desktop-release-kit$ ]]; then
            echo "::error ::KIT_WORKFLOW_REF must resolve to <owner>/desktop-release-kit, got: ${repository:-<empty>}"
            exit 1
          fi
          echo "repository=${repository}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref##*@}" >> "$GITHUB_OUTPUT"

      - name: Checkout release kit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.kit.outputs.repository }}
          ref: ${{ steps.kit.outputs.ref }}
          path: .release-kit
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ inputs['node-version'] }}

      - name: Resolve release metadata
        shell: bash
        run: node .release-kit/scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Enable Corepack
        run: corepack enable

      - name: Install JS dependencies
        run: ${{ env.INSTALL_COMMAND }}

      - name: Set desktop package version from tag
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const version = process.env.DESKTOP_VERSION;
          if (!version) throw new Error('DESKTOP_VERSION env var is missing');

          // The desktop package gate asserts its version matches the root
          // workspace manifest, so stamp both.
          for (const packageJsonPath of [
            path.join(process.env.DESKTOP_PACKAGE_PATH, 'package.json'),
            'package.json',
          ]) {
            const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, 'utf8'));
            packageJson.version = version;
            fs.writeFileSync(packageJsonPath, `${JSON.stringify(packageJson, null, 2)}\n`);
          }
          NODE

      - name: Download signed app artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: win-unpacked-signed-${{ env.DESKTOP_VERSION }}
          path: ${{ env.DESKTOP_PACKAGE_PATH }}/dist/win-unpacked

      - name: Verify signed app executables
        shell: pwsh
        run: |
          $appRoot = Join-Path $env:DESKTOP_PACKAGE_PATH 'dist/win-unpacked'
          $targets = @(node .release-kit/scripts/list-windows-signing-targets.mjs --root $appRoot)
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve Windows signing targets.' }
          if ($targets.Count -lt 1) { throw 'Signing target list is empty at verification.' }
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target
            if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
              throw "Unsigned or invalid signature: $target ($($signature.Status))"
            }
          }

      - name: Package signed app as NSIS installer
        shell: bash
        run: |
          ${{ env.WORKSPACE_RUN_PREFIX }} "$DESKTOP_WORKSPACE" dist:win-installer
          # Same channel normalization as macOS: electron-builder writes rc.yml
          # for -rc.N versions; downstream always reads latest.yml.
          case "$DESKTOP_VERSION" in
            *-*) pre="${DESKTOP_VERSION#*-}"; channel="${pre%%.*}";;
            *)   channel="latest";;
          esac
          dist="$DESKTOP_PACKAGE_PATH/dist"
          [ -f "$dist/${channel}.yml" ] || { echo "::error ::${channel}.yml missing under $dist"; ls "$dist"; exit 1; }
          if [ "$channel" != "latest" ]; then
            cp "$dist/${channel}.yml" "$dist/latest.yml"
          fi

      - name: Verify signed payload inside installer
        shell: pwsh
        run: |
          # electron-builder rewrites payload files during NSIS packing (it
          # replaced a Jenkins-signed elevate.exe with its own unsigned copy).
          # The pre-pack verification above cannot see that, so re-verify the
          # bytes actually shipped inside the installer. NSIS nests the app
          # files in $PLUGINSDIR/app-64.7z — extract two levels.
          $pattern = "$env:DESKTOP_PACKAGE_PATH/dist/${env:INSTALLER_PREFIX}-${env:DESKTOP_VERSION}-*-Setup.exe"
          $installers = @(Get-ChildItem $pattern -ErrorAction SilentlyContinue)
          if ($installers.Count -ne 1) { throw "Expected exactly one installer matching $pattern, found $($installers.Count)" }
          $installer = $installers[0]
          $outer = Join-Path $env:RUNNER_TEMP 'installer-outer'
          & 7z x $installer.FullName "-o$outer" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw '7z extraction of installer failed' }
          # useZip: true packs app-64.zip instead of the 7z default.
          $appArchive = @('app-64.zip', 'app-64.7z') |
            ForEach-Object { Join-Path $outer "`$PLUGINSDIR/$_" } |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1
          if (-not $appArchive) { throw "app-64.zip / app-64.7z not found in extracted installer" }
          $payload = Join-Path $env:RUNNER_TEMP 'installer-payload'
          & 7z x $appArchive "-o$payload" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw '7z extraction of app-64.7z failed' }
          $targets = @(node .release-kit/scripts/list-windows-signing-targets.mjs --root $payload)
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve signing targets in extracted payload.' }
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target
            if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
              throw "Unsigned or invalid signature inside installer: $target ($($signature.Status))"
            }
          }

      - name: Upload unsigned installer artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installer-unsigned-${{ env.DESKTOP_VERSION }}
          path: |
            ${{ env.DESKTOP_PACKAGE_PATH }}/dist/${{ env.INSTALLER_PREFIX }}-*-Setup.exe
            ${{ env.DESKTOP_PACKAGE_PATH }}/dist/latest.yml
          retention-days: 1

  # Sign the Windows installer through the internal Jenkins job. Runs on the
  # self-hosted sign runner because Jenkins lives on the corporate network and
  # cloud runners cannot reach it. Uploads the signed exe under the versioned
  # R2 prefix; updater pointers are published later by `promote`.
  sign-windows:
    needs: [package-windows-installer]
    if: ${{ always() && needs.package-windows-installer.result == 'success' }}
    runs-on: sign
    permissions:
      contents: read
    steps:
      - name: Resolve kit source
        id: kit
        shell: bash
        run: |
          ref="${KIT_WORKFLOW_REF}"
          repository="${ref%%/.github/*}"
          if [[ ! "$repository" =~ ^[A-Za-z0-9._-]+/desktop-release-kit$ ]]; then
            echo "::error ::KIT_WORKFLOW_REF must resolve to <owner>/desktop-release-kit, got: ${repository:-<empty>}"
            exit 1
          fi
          echo "repository=${repository}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref##*@}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.kit.outputs.repository }}
          ref: ${{ steps.kit.outputs.ref }}
          persist-credentials: false

      # The self-hosted sign runner is a bare machine with no preinstalled
      # toolchain — install Node here (the scripts below run under `node`).
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ inputs['node-version'] }}

      # The manifest rewrite step below parses electron-builder's latest.yml with
      # `yaml`; install just that one package so it runs without the whole
      # workspace. The scripts/ prefix keeps npm away from the caller's manifest.
      - name: Install manifest dependency
        shell: bash
        run: npm install --prefix scripts --no-save --ignore-scripts yaml@2

      - name: Resolve release metadata
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Download unsigned installer artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: installer-unsigned-${{ env.DESKTOP_VERSION }}
          path: dist

      - name: Sign installer via Jenkins
        shell: bash
        env:
          JENKINS_URL: ${{ secrets.JENKINS_SIGN_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_SIGN_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_SIGN_TOKEN }}
        run: |
          # Exact version binding: never "first exe in the directory". The
          # sign/verify/upload steps must all target the same file.
          installers=(dist/${INSTALLER_PREFIX}-${DESKTOP_VERSION}-*-Setup.exe)
          if [ ${#installers[@]} -ne 1 ] || [ ! -f "${installers[0]}" ]; then
            echo "::error ::Expected exactly one installer matching ${INSTALLER_PREFIX}-${DESKTOP_VERSION}-*-Setup.exe"
            ls dist/ || true
            exit 1
          fi
          node scripts/sign-windows-via-jenkins.mjs --exe "${installers[0]}"

      - name: Verify signed installer Authenticode
        shell: pwsh
        run: |
          $pattern = "dist/${env:INSTALLER_PREFIX}-${env:DESKTOP_VERSION}-*-Setup.exe"
          $installers = @(Get-ChildItem $pattern -ErrorAction SilentlyContinue)
          if ($installers.Count -ne 1) { throw "Expected exactly one installer matching $pattern, found $($installers.Count)" }
          $installer = $installers[0]
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
            Write-Host "::error ::Unsigned or invalid Authenticode signature: $($installer.FullName) ($($signature.Status))"
            exit 1
          }

      - name: Upload signed installer to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
        run: |
          installers=(dist/${INSTALLER_PREFIX}-${DESKTOP_VERSION}-*-Setup.exe)
          if [ ${#installers[@]} -ne 1 ] || [ ! -f "${installers[0]}" ]; then
            echo "::error ::Expected exactly one signed installer matching ${INSTALLER_PREFIX}-${DESKTOP_VERSION}-*-Setup.exe"
            ls dist/ || true
            exit 1
          fi
          installer_path="${installers[0]}"

          # Upload via a stdlib-only Node SigV4 helper — the bare sign runner has
          # no aws-cli and can't pip-install one.
          node scripts/r2-put.mjs \
            --file "$installer_path" \
            --bucket "$R2_BUCKET" \
            --key "$PRODUCT_SLUG/$DESKTOP_VERSION/$(basename "$installer_path")" \
            --endpoint "$R2_ENDPOINT" \
            --immutable

          # electron-builder's own latest.yml (shipped alongside the installer
          # artifact) predates signing, so its sha512/size are stale. Parse and
          # rewrite it structurally: prefix every relative url/path — including
          # the NSIS differential-update `packages` entries — with the version
          # dir, and refresh hash/size only on the entry that names the signed
          # installer (packages entries keep electron-builder's own values).
          INSTALLER="$installer_path" VERSION="$DESKTOP_VERSION" NODE_PATH="$PWD/scripts/node_modules" node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync, statSync, writeFileSync } from 'node:fs'
          import { basename } from 'node:path'
          import { parse, stringify } from 'yaml'

          const installer = process.env.INSTALLER
          const version = process.env.VERSION
          const name = basename(installer)
          const sha512 = createHash('sha512').update(readFileSync(installer)).digest('base64')
          const size = statSync(installer).size

          const manifestPath = 'dist/latest.yml'
          const manifest = parse(readFileSync(manifestPath, 'utf8'))

          if (manifest.version !== version) {
            console.error(`::error ::latest.yml version ${manifest.version} != ${version}`)
            process.exit(1)
          }

          // Prefix every relative url/path with the version directory.
          const prefixIfRelative = (value) => (typeof value === 'string' && !value.includes('/') ? `${version}/${value}` : value)
          for (const entry of manifest.files ?? []) {
            if (entry && typeof entry === 'object') {
              if (typeof entry.url === 'string') entry.url = prefixIfRelative(entry.url)
              if (typeof entry.path === 'string') entry.path = prefixIfRelative(entry.path)
            }
          }
          if (typeof manifest.path === 'string') manifest.path = prefixIfRelative(manifest.path)
          if (manifest.packages && typeof manifest.packages === 'object') {
            for (const pkg of Object.values(manifest.packages)) {
              if (pkg && typeof pkg === 'object' && typeof pkg.path === 'string') pkg.path = prefixIfRelative(pkg.path)
            }
          }

          // Refresh hash/size only on entries that describe the signed installer.
          let touched = 0
          for (const entry of manifest.files ?? []) {
            if (entry && typeof entry === 'object' && typeof entry.url === 'string' && entry.url.split('/').pop() === name) {
              entry.sha512 = sha512
              entry.size = size
              touched += 1
            }
          }
          if (typeof manifest.path === 'string' && manifest.path.split('/').pop() === name) {
            manifest.sha512 = sha512
            manifest.size = size
          }
          if (touched === 0) {
            console.error(`::error ::latest.yml has no files entry for ${name}`)
            process.exit(1)
          }

          writeFileSync(manifestPath, stringify(manifest))
          console.log(`latest.yml rewritten for signed ${name} (${size} bytes)`)
          NODE

      - name: Upload Windows manifest artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: win-manifest-${{ env.DESKTOP_VERSION }}
          path: dist/latest.yml
          retention-days: 1

  # Publish updater pointers only after both platforms succeeded. Versioned
  # objects are immutable; these keys move.
  promote:
    needs: [publish-macos, sign-windows]
    if: ${{ always() && needs.publish-macos.result == 'success' && needs.sign-windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve kit source
        id: kit
        shell: bash
        run: |
          ref="${KIT_WORKFLOW_REF}"
          repository="${ref%%/.github/*}"
          if [[ ! "$repository" =~ ^[A-Za-z0-9._-]+/desktop-release-kit$ ]]; then
            echo "::error ::KIT_WORKFLOW_REF must resolve to <owner>/desktop-release-kit, got: ${repository:-<empty>}"
            exit 1
          fi
          echo "repository=${repository}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref##*@}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.kit.outputs.repository }}
          ref: ${{ steps.kit.outputs.ref }}
          persist-credentials: false
          sparse-checkout: scripts

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ inputs['node-version'] }}

      - name: Resolve release metadata
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      # verify-published-artifacts.mjs imports `yaml`; install just that one
      # package so the download check runs without the whole workspace.
      - name: Install manifest dependency
        shell: bash
        run: npm install --prefix scripts --no-save --ignore-scripts yaml@2

      - name: Download macOS manifest artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: mac-manifest-${{ env.DESKTOP_VERSION }}
          path: manifests/mac

      - name: Download Windows manifest artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: win-manifest-${{ env.DESKTOP_VERSION }}
          path: manifests/win

      - name: Publish updater pointers to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
        run: |
          mac_manifest="$(find manifests/mac -name 'latest-mac.yml' -print -quit)"
          win_manifest="$(find manifests/win -name 'latest.yml' -print -quit)"
          if [[ -z "$mac_manifest" || ! -f "$mac_manifest" ]]; then
            echo "::error ::Missing macOS updater manifest artifact."
            exit 1
          fi
          if [[ -z "$win_manifest" || ! -f "$win_manifest" ]]; then
            echo "::error ::Missing Windows updater manifest artifact."
            exit 1
          fi

          if [ "$IS_PRERELEASE" = "true" ]; then
            mac_key="rc-mac.yml"
            win_key="rc.yml"
          else
            mac_key="latest-mac.yml"
            win_key="latest.yml"
          fi

          # Stable CAS: read desktop-version.json, refuse existing >= current
          # (full SemVer, no-prerelease wins), then write pointers. Prerelease
          # only writes rc*.yml and must not touch stable keys.
          if [ "$IS_PRERELEASE" != "true" ]; then
            existing="$(mktemp)"
            set +e
            err="$(node scripts/s3-get.mjs \
              --bucket "$R2_BUCKET" \
              --key "$PRODUCT_SLUG/desktop-version.json" \
              --endpoint "$R2_ENDPOINT" \
              --output "$existing" 2>&1)"
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              if [[ "$err" == *"HTTP 404"* ]]; then
                echo "No existing desktop-version.json — first stable publish."
              else
                echo "::error ::Failed to read existing desktop-version.json"
                echo "$err"
                exit 1
              fi
            else
              EXISTING_VERSION_FILE="$existing" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { compareReleaseVersions, parseReleaseVersion } from "./scripts/release-version-utils.mjs";

          const existingPath = process.env.EXISTING_VERSION_FILE;
          const current = process.env.DESKTOP_VERSION;
          const existing = JSON.parse(readFileSync(existingPath, "utf8"));
          if (typeof existing?.version !== "string") {
            console.error("::error ::desktop-version.json is missing a version string");
            process.exit(1);
          }
          parseReleaseVersion(existing.version);
          parseReleaseVersion(current);
          if (compareReleaseVersions(existing.version, current) >= 0) {
            console.error(`::error ::Refusing to move stable pointer from ${existing.version} to ${current} (existing >= current)`);
            process.exit(1);
          }
          NODE
            fi
          fi

          node scripts/r2-put.mjs \
            --file "$mac_manifest" \
            --bucket "$R2_BUCKET" \
            --key "$PRODUCT_SLUG/$mac_key" \
            --endpoint "$R2_ENDPOINT"
          node scripts/r2-put.mjs \
            --file "$win_manifest" \
            --bucket "$R2_BUCKET" \
            --key "$PRODUCT_SLUG/$win_key" \
            --endpoint "$R2_ENDPOINT"

          # Prerelease must not move stable pointers (desktop-version.json / latest*).
          if [ "$IS_PRERELEASE" != "true" ]; then
            printf '{"version":"%s"}\n' "$DESKTOP_VERSION" > desktop-version.json
            node scripts/r2-put.mjs \
              --file desktop-version.json \
              --bucket "$R2_BUCKET" \
              --key "$PRODUCT_SLUG/desktop-version.json" \
              --endpoint "$R2_ENDPOINT"
          fi

      # The one assertion that re-establishes "green run == published release":
      # read the pointer back through the S3 API and require that it names this
      # exact version. Whatever silently skipped upstream, a stale pointer here
      # is a red run.
      - name: Verify promoted pointer (read-back)
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            keys="rc-mac.yml rc.yml"
          else
            keys="latest-mac.yml latest.yml"
          fi
          for key in $keys; do
            readback="$(mktemp)"
            node scripts/s3-get.mjs \
              --bucket "$R2_BUCKET" \
              --key "$PRODUCT_SLUG/$key" \
              --endpoint "$R2_ENDPOINT" \
              --output "$readback"
            published="$(sed -n 's/^version:[[:space:]]*//p' "$readback" | head -1)"
            if [ "$published" != "$DESKTOP_VERSION" ]; then
              echo "::error ::Promoted pointer $key reads back version '$published', expected '$DESKTOP_VERSION'"
              exit 1
            fi
            echo "Pointer $key confirms $published"
          done

      # Reading the manifest is not proof the artifacts behind it are reachable: a
      # CDN can answer HEAD from bucket metadata while GET falls through to an SPA
      # rewrite, so clients download an HTML page instead of the installer. Stream
      # real bytes from every entry and check what comes back.
      - name: Verify published artifacts are downloadable
        shell: bash
        env:
          NODE_PATH: ${{ github.workspace }}/scripts/node_modules
        run: |
          base="${DOWNLOADS_BASE%/}/$PRODUCT_SLUG"
          for manifest in $(find manifests -name '*.yml' -print); do
            echo "checking $manifest against $base"
            node scripts/verify-published-artifacts.mjs \
              --manifest "$manifest" \
              --base "$base" \
              --max-bytes "${{ inputs['verify-published-bytes'] }}"
          done
