name: Probe JobWorkflowRef
on:
  workflow_call:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump all candidate contexts
        run: |
          echo 'job_workflow_ref: [${{ github.job_workflow_ref }}]'
          echo 'job_workflow_sha: [${{ github.job_workflow_sha }}]'
          echo 'workflow_ref:     [${{ github.workflow_ref }}]'
          echo 'workflow_sha:     [${{ github.workflow_sha }}]'
          echo 'repository:       [${{ github.repository }}]'
