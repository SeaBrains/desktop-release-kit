name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"

      - name: Install script dependencies
        run: npm ci --prefix scripts

      - name: Run tests
        run: npm test

      # A syntax error here only surfaces when a product repo tries to release,
      # where the failure looks like a problem with the caller.
      - name: Validate release workflow YAML
        env:
          NODE_PATH: ${{ github.workspace }}/scripts/node_modules
        run: |
          node -e "
            const { parse } = require('yaml');
            const doc = parse(require('fs').readFileSync('.github/workflows/release.yml', 'utf8'));
            const jobs = Object.keys(doc.jobs ?? {});
            if (jobs.length === 0) throw new Error('release.yml declares no jobs');
            console.log('release.yml parses with ' + jobs.length + ' jobs: ' + jobs.join(', '));
          "

      # Floating tags let a compromised action reach the signing runner.
      - name: Require pinned action SHAs
        run: |
          if floating=$(grep -nE 'uses: [a-z0-9-]+/[^@]+@(v[0-9]|main|master)' .github/workflows/*.yml); then
            echo "::error ::Actions must be pinned to a commit SHA:"
            echo "$floating"
            exit 1
          fi
          echo "all actions pinned to commit SHAs"
